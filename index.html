<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lost Lead Intelligence</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Public+Sans:ital,wght@0,300;0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#EBEEE8; --panel:#FFFFFF; --panel-2:#F5F7F2;
    --ink:#161C19; --ink-2:#5C6762; --ink-3:#8B958F;
    --rule:#D3D9CF; --rule-2:#E4E8E0;
    --neg:#9C3A25; --neg-soft:#EBD6CF;
    --pos:#1C6853; --pos-soft:#CFE2DA;
    --neu:#7C8781; --neu-soft:#E0E4DE;
    --warn:#A8761A; --warn-soft:#F0E4CB;
    --focus:#2C5C9E;
    --sans:"Public Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    --display:"Bricolage Grotesque","Public Sans",system-ui,sans-serif;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --paper:#101513; --panel:#181E1B; --panel-2:#1F2623;
      --ink:#E4E9E3; --ink-2:#98A29B; --ink-3:#737E77;
      --rule:#2A322E; --rule-2:#232B27;
      --neg:#D97B60; --neg-soft:#3A2620; --pos:#4FAE90; --pos-soft:#17332B;
      --neu:#8B958F; --neu-soft:#252D29; --warn:#D2A44F; --warn-soft:#332813; --focus:#7FA9E8;
    }
  }
  :root[data-theme="dark"]{
    --paper:#101513; --panel:#181E1B; --panel-2:#1F2623;
    --ink:#E4E9E3; --ink-2:#98A29B; --ink-3:#737E77;
    --rule:#2A322E; --rule-2:#232B27;
    --neg:#D97B60; --neg-soft:#3A2620; --pos:#4FAE90; --pos-soft:#17332B;
    --neu:#8B958F; --neu-soft:#252D29; --warn:#D2A44F; --warn-soft:#332813; --focus:#7FA9E8;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{background:var(--paper); color:var(--ink); font-family:var(--sans); font-size:15px; line-height:1.5;
       -webkit-font-smoothing:antialiased; font-variant-numeric:tabular-nums}
  h1,h2,h3{font-family:var(--display); font-weight:700; letter-spacing:-0.02em; margin:0}
  a{color:var(--focus)}
  :focus-visible{outline:2px solid var(--focus); outline-offset:2px; border-radius:2px}
  @media (prefers-reduced-motion: reduce){*{transition:none !important}}

  .bar{position:sticky; top:0; z-index:20; background:var(--panel); border-bottom:1px solid var(--rule);
       padding:10px 20px; display:flex; align-items:center; gap:16px; flex-wrap:wrap}
  .brand{display:flex; align-items:baseline; gap:10px; margin-right:auto}
  .brand b{font-family:var(--display); font-size:19px; font-weight:700; letter-spacing:-0.03em}
  .brand span{color:var(--ink-3); font-size:12.5px}
  nav{display:flex; gap:2px; flex-wrap:wrap}
  nav button{font:inherit; font-size:13.5px; font-weight:500; color:var(--ink-2); background:none;
             border:1px solid transparent; border-radius:999px; padding:5px 13px; cursor:pointer}
  nav button:hover{color:var(--ink); background:var(--panel-2)}
  nav button[aria-current="page"]{background:var(--ink); color:var(--panel); border-color:var(--ink)}
  .who{display:flex; align-items:center; gap:8px; font-size:13px; color:var(--ink-2)}
  .dot{width:7px;height:7px;border-radius:50%;background:var(--pos)} .dot.off{background:var(--warn)}
  main{max-width:1200px; margin:0 auto; padding:24px 20px 90px}

  .panel{background:var(--panel); border:1px solid var(--rule); border-radius:6px; padding:18px 20px}
  .panel + .panel{margin-top:16px}
  .panel h2{font-size:17px}
  .panel .sub{color:var(--ink-2); font-size:13px; margin:2px 0 16px}
  .grid{display:grid; gap:16px}
  @media (min-width:920px){ .cols{grid-template-columns:1fr 1fr} .call{grid-template-columns:minmax(0,1.45fr) minmax(0,1fr); align-items:start} }

  label{display:block; font-size:12.5px; font-weight:600; color:var(--ink-2); margin-bottom:5px}
  input[type=text],input[type=number],input[type=date],select,textarea{
    width:100%; font:inherit; font-size:14.5px; color:var(--ink); background:var(--panel-2);
    border:1px solid var(--rule); border-radius:4px; padding:8px 10px}
  textarea{resize:vertical; min-height:110px; line-height:1.6}
  textarea.big{min-height:280px; font-size:15px}
  .field{margin-bottom:16px}
  .row{display:flex; gap:12px; flex-wrap:wrap}
  .row > .field{flex:1 1 170px}
  .seg{display:flex; flex-wrap:wrap; gap:6px}
  .seg button{font:inherit; font-size:13.5px; padding:6px 12px; border-radius:4px; cursor:pointer;
              background:var(--panel-2); border:1px solid var(--rule); color:var(--ink-2); text-align:left}
  .seg button[aria-pressed="true"]{background:var(--ink); border-color:var(--ink); color:var(--panel)}
  .btn{font:inherit; font-size:14.5px; font-weight:600; cursor:pointer; background:var(--ink); color:var(--panel);
       border:1px solid var(--ink); border-radius:4px; padding:9px 18px}
  .btn.ghost{background:transparent; color:var(--ink-2); border-color:var(--rule); font-weight:500}
  .btn.ghost:hover{color:var(--ink); border-color:var(--ink-3)}
  .btn:disabled{opacity:.45; cursor:not-allowed}
  .btn.tiny{font-size:12.5px; padding:4px 10px}
  .hint{font-size:12.5px; color:var(--ink-3)}
  .ask{font-size:14px; color:var(--ink); margin:0 0 7px; padding-left:11px; border-left:2px solid var(--rule)}
  .ask em{font-style:italic; color:var(--ink-2)}
  .chip{display:inline-flex; align-items:center; gap:6px; font-size:12.5px; border:1px solid var(--rule);
        border-radius:999px; padding:3px 10px; background:var(--panel-2); color:var(--ink-2)}
  .chip.link{cursor:pointer}
  .chip.on{background:var(--ink);border-color:var(--ink);color:var(--panel)}

  .kpis{display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:1px; background:var(--rule);
        border:1px solid var(--rule); border-radius:6px; overflow:hidden}
  .kpi{background:var(--panel); padding:14px 16px}
  .kpi .v{font-family:var(--display); font-size:27px; font-weight:700; letter-spacing:-0.03em; line-height:1.1}
  .kpi .k{font-size:12.5px; color:var(--ink-2); margin-top:3px}
  .kpi .d{font-size:12px; margin-top:4px; color:var(--ink-3)}

  table{width:100%; border-collapse:collapse; font-size:13.5px}
  th{text-align:left; font-size:12px; font-weight:600; color:var(--ink-2); padding:7px 10px; border-bottom:1px solid var(--rule)}
  td{padding:9px 10px; border-bottom:1px solid var(--rule-2); vertical-align:top}
  tr:last-child td{border-bottom:none}
  .scroll{overflow-x:auto}
  .verb{color:var(--ink-2); max-width:400px}

  .bars{display:grid; gap:9px}
  .bars .b{display:grid; grid-template-columns:minmax(130px,1.2fr) minmax(0,3fr) 78px; gap:10px; align-items:center; font-size:13.5px}
  .bars .track{height:16px; background:var(--panel-2); border-radius:3px; overflow:hidden}
  .bars .fill{height:100%; border-radius:3px; background:var(--ink)}
  .bars .num{text-align:right; color:var(--ink-2); font-size:12.5px}

  .finding{border:1px solid var(--rule); border-left:3px solid var(--warn); border-radius:0 5px 5px 0;
           padding:14px 16px; margin-bottom:12px; background:var(--panel)}
  .finding h3{font-family:var(--display); font-size:16px; margin-bottom:5px}
  .finding p{margin:0 0 8px; font-size:14px; color:var(--ink-2)}
  .finding .why{font-size:12.5px; color:var(--ink-3); border-top:1px solid var(--rule-2); padding-top:7px}
  .finding.act-price{border-left-color:var(--neg)}
  .finding.act-product{border-left-color:var(--focus)}
  .finding.act-ops{border-left-color:var(--pos)}

  /* story */
  .story{max-width:74ch}
  .story h2{font-size:24px; margin-bottom:4px}
  .story h3{font-family:var(--display); font-size:18px; margin:28px 0 10px; padding-top:18px; border-top:1px solid var(--rule)}
  .story h3:first-of-type{border-top:none; padding-top:0; margin-top:18px}
  .story p{font-size:15.5px; line-height:1.68; margin:0 0 13px}
  .story ul{margin:0 0 14px; padding-left:20px} .story li{margin-bottom:7px; font-size:15px}
  .story .said{border-left:2px solid var(--rule); padding:3px 0 3px 14px; margin:0 0 14px; font-size:15px}
  .story .said span{display:block; font-size:12.5px; color:var(--ink-3); margin-top:4px}
  .story .basis{font-size:12.5px; color:var(--ink-3); background:var(--panel-2); border-radius:4px; padding:9px 12px; margin:0 0 14px}

  .empty{text-align:center; padding:44px 20px; color:var(--ink-2)}
  .empty b{display:block; font-family:var(--display); font-size:19px; color:var(--ink); margin-bottom:6px}
  .banner{border:1px solid var(--rule); border-left:3px solid var(--warn); background:var(--panel);
          padding:10px 14px; border-radius:0 4px 4px 0; font-size:13.5px; color:var(--ink-2); margin-bottom:16px}
  .note{background:var(--panel-2); border:1px solid var(--rule-2); border-radius:5px; padding:14px 16px; margin-bottom:12px}
  .note .meta{font-size:12.5px; color:var(--ink-3); margin-bottom:7px; display:flex; gap:10px; flex-wrap:wrap}
  .note .body{font-size:14.5px; line-height:1.65; white-space:pre-wrap}
  .note mark{background:var(--warn-soft); color:inherit; border-radius:2px; padding:0 2px}
  .counter{font-size:12.5px; color:var(--ink-3); text-align:right; margin-top:5px}
  .counter.low{color:var(--warn)}

  #toast{position:fixed; left:50%; bottom:26px; transform:translateX(-50%); background:var(--ink); color:var(--panel);
         padding:10px 18px; border-radius:4px; font-size:14px; opacity:0; pointer-events:none; transition:opacity .18s; z-index:50; max-width:90vw}
  #toast.show{opacity:1}
  .steps{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:14px; font-size:12.5px; color:var(--ink-3)}
  .steps b{color:var(--ink); font-weight:600}
</style>
</head>
<body>

<header class="bar">
  <div class="brand"><b>Lost Lead Intelligence</b> <span>structured debriefs, no model</span></div>
  <nav id="nav">
    <button data-view="call" aria-current="page">Debrief call</button>
    <button data-view="story">Story</button>
    <button data-view="intel">Signals</button>
    <button data-view="mgmt">Management</button>
    <button data-view="repo">Notes</button>
    <button data-view="winback">Win-back</button>
    <button data-view="script">Question set</button>
  </nav>
  <div class="who" id="who"><span class="dot off"></span><span id="whoName">connecting…</span></div>
</header>

<main id="app"></main>
<div id="toast" role="status" aria-live="polite"></div>

<script>
"use strict";

/* ==========================================================================
   1. TAXONOMY
   ========================================================================== */
const REASONS = [
  {id:"fees",       label:"Fees too High"},
  {id:"demo",       label:"Demo Experience Bad"},
  {id:"reviews",    label:"Bad Reviews"},
  {id:"schedule",   label:"Kid busy Schedule"},
  {id:"kidint",     label:"Kid not Interested"},
  {id:"curriculum", label:"Did not like the Curriculum"},
  {id:"competitor", label:"Signed with Competitors"},
  {id:"visa",       label:"Visa / Job uncertainty"},
  {id:"vacation",   label:"Vacations"},
  {id:"age",        label:"Unqualified — Age"},
  {id:"neuro",      label:"Unqualified — ADHD / Autism"},
  {id:"language",   label:"Language Barrier"},
  {id:"other",      label:"Something else"}
];
const reasonLabel = id => (REASONS.find(r=>r.id===id)||{}).label || id || "—";

const PROBES = {
  fees: [
    {id:"fee_quoted", type:"number", ask:"Just so I have it right — what was the price we quoted you?", hint:"Total package price, numbers only"},
    {id:"fee_accept", type:"number", ask:"If we had been able to do it, what price would have got a yes from you that day?", hint:"Their number, not a band you suggest"},
    {id:"fee_compare", type:"single", ask:"When you said it felt high — high compared to what?",
      options:["A competitor's quote","Another class the kid already does","Our general monthly budget","Nothing specific, just felt high"]},
    {id:"fee_heavy", type:"multi", ask:"Which part of it felt heavy — the total, the per-class price, or how much was due upfront?",
      options:["Total package size","Per-class price","Amount due upfront","Length of commitment","No refund / no exit option","Unclear what's included"]},
    {id:"fee_structure", type:"single", ask:"If we had offered a monthly plan or a smaller starter pack at the same per-class price, would that have worked?",
      options:["Yes, that would have closed it","Maybe","No — the price itself was the issue"]}
  ],
  demo: [
    {id:"demo_what", type:"multi", ask:"Take me back to the demo — what specifically didn't work?",
      options:["Teacher's teaching","Teacher's accent or English","Teacher was late or didn't show","Tech / audio / video problems","Felt like a sales pitch","Kid wasn't engaged","Content too easy","Content too hard","Too short to judge","No clear next step explained"]},
    {id:"demo_teacher", type:"single", ask:"Did it feel like the teacher was prepared for your child specifically?",
      options:["Yes","Somewhat","No, felt generic"]},
    {id:"demo_retry", type:"single", ask:"If we set up a second demo with a different teacher, would you take it?",
      options:["Yes","Maybe","No"]}
  ],
  reviews: [
    {id:"rev_where", type:"multi", ask:"Where did you come across the reviews?",
      options:["Google","Trustpilot","Reddit","YouTube","Facebook group","WhatsApp parent group","Friend or family","App store"]},
    {id:"rev_what", type:"multi", ask:"What was the concern in what you read?",
      options:["Refund problems","Teacher quality","Aggressive sales calls","Hidden or surprise charges","Classes cancelled or rescheduled","Company stability","Results didn't match promise"]},
    {id:"rev_asked", type:"single", ask:"Did anyone from our side address that with you before you decided?",
      options:["Yes, and it didn't convince me","Yes, and it helped but not enough","No, nobody raised it"]}
  ],
  schedule: [
    {id:"sch_competing", type:"multi", ask:"What's taking up that time right now?",
      options:["School workload","Exam season","Other tuition or classes","Sports","Music or arts","Family time","Limiting screen time"]},
    {id:"sch_slot", type:"multi", ask:"If the slot were yours to pick, when would actually work?",
      options:["Before school","Right after school","Evening","Late evening","Saturday","Sunday","No fixed slot — on demand"]},
    {id:"sch_format", type:"single", ask:"Would recorded lessons your child does at their own pace work, or does it need to be live?",
      options:["Self-paced would work","Mix of both","Must be live"]},
    {id:"sch_freq", type:"single", ask:"How often would feel comfortable?",
      options:["Once a week","Twice a week","Three or more","Once a fortnight"]}
  ],
  kidint: [
    {id:"kid_why", type:"multi", ask:"What did your child say about it?",
      options:["Boring","Too hard","Too easy / babyish","Didn't like the teacher","Doesn't like online classes","Too much like school","Didn't want one more class"]},
    {id:"kid_likes", type:"multi", ask:"What does your child actually get excited about?",
      options:["Gaming","Art and drawing","Sports","Music","Robotics / building","Reading","Science experiments","Videos and animation","Nothing in particular yet"]},
    {id:"kid_format", type:"multi", ask:"What might have made them want to come back?",
      options:["Game-based lessons","Building a real project","Class with friends or peers","Shorter sessions","A different topic","Younger or more playful teacher","Rewards or levels"]},
    {id:"kid_present", type:"single", ask:"Was your child actually in the demo with you?",
      options:["Yes, fully","Partly","No"]}
  ],
  curriculum: [
    {id:"cur_gap", type:"multi", ask:"What was missing in what we showed you?",
      options:["Too basic","Too advanced","Not aligned to school syllabus","No certificate or credential","No real projects","Outcome wasn't clear","Program too long","Topics felt outdated","No assessment or progress tracking"]},
    {id:"cur_outcome", type:"single", ask:"What were you really hoping this would do for your child?",
      options:["Help with school marks","Competition or olympiad prep","A career skill for later","A serious hobby","Screen-time with a purpose","Confidence and communication"]},
    {id:"cur_want", type:"text", ask:"If we built exactly the right program for your child, what would be in it?", hint:"Their words — this feeds the roadmap"}
  ],
  competitor: [
    {id:"comp_name", type:"text", ask:"Which one did you go with?", hint:"Company name"},
    {id:"comp_price", type:"number", ask:"And what are you paying there?", hint:"Numbers only, same basis as our quote"},
    {id:"comp_why", type:"multi", ask:"What made them the better choice?",
      options:["Cheaper","Better teacher","Better curriculum","Recommended by someone we trust","Slot timings suited us","Longer or free trial","Faster to start","Brand reputation","In our own language","Offline / in-person option"]},
    {id:"comp_lock", type:"single", ask:"How long have you signed up for?",
      options:["Trial only","Monthly, can stop anytime","Paid a few months","Paid a full year"]},
    {id:"comp_switch", type:"multi", ask:"Honestly — what would we have to do for you to come back to us?",
      options:["Match their price","Better teacher","Specific curriculum","Better timings","Nothing, we're settled","Would try again after this batch"]}
  ],
  visa: [
    {id:"visa_when", type:"single", ask:"When do you expect to have clarity?",
      options:["Within a month","One to three months","Three to six months","No idea yet"]},
    {id:"visa_pause", type:"single", ask:"If you could pause the course and keep your unused classes, would that change things?",
      options:["Yes, that solves it","Maybe","No"]},
    {id:"visa_where", type:"text", ask:"Where are you likely to be based?", hint:"Country or city — tells us about time zones"}
  ],
  vacation: [
    {id:"vac_back", type:"date", ask:"When are you back?", hint:"Used as the callback date if you don't set one"},
    {id:"vac_option", type:"multi", ask:"Would any of these have worked during the break?",
      options:["Lighter schedule while travelling","Recorded lessons","Start now, pause later","Nothing — prefer to start fresh"]}
  ],
  age: [
    {id:"age_actual", type:"number", ask:"How old is your child now?", hint:"Years"},
    {id:"age_side", type:"single", ask:"", options:["Younger than our range","Older than our range"]},
    {id:"age_would", type:"single", ask:"If we had a program built for that age, would you enrol?", options:["Yes","Maybe","No"]},
    {id:"age_sibling", type:"single", ask:"Do you have another child who might be in the right age range?", options:["Yes","No"]}
  ],
  neuro: [
    {id:"neuro_support", type:"multi", ask:"What would your child need from a class for it to work well for them?",
      options:["Slower pace","Shorter sessions","One-to-one instead of group","Teacher trained in special needs","Parent allowed in the class","Predictable routine and structure","Fewer visual or audio distractions","Flexible attendance"]},
    {id:"neuro_pay", type:"single", ask:"If we built a program designed around that, would you consider it?",
      options:["Yes, and would pay more for it","Yes, at the same price","No"]},
    {id:"neuro_current", type:"text", ask:"Is your child in any class today that does work well? What do they do differently?", hint:"Competitive and design intelligence"}
  ],
  language: [
    {id:"lang_pref", type:"text", ask:"Which language would you and your child be most comfortable in?", hint:"One language name"},
    {id:"lang_who", type:"single", ask:"Was it harder for you to follow, or for your child in the class?",
      options:["For the parent","For the child","For both"]},
    {id:"lang_fix", type:"single", ask:"Would a teacher who can switch between that language and English solve it?",
      options:["Yes","Partly","No — needs full native language"]}
  ],
  other: [ {id:"oth_what", type:"text", ask:"Tell me what actually stopped you.", hint:"Their words"} ]
};

const CLOSERS = [
  {id:"cl_moment", type:"single", ask:"Thinking back — at what point did you decide this wasn't for you?",
    options:["Before the demo even happened","During the demo","When we quoted the price","After the demo, thinking it over","After speaking to another provider","After our follow-up calls","We never really decided, it just faded"]},
  {id:"cl_followup", type:"single", ask:"After that, did anyone from our side get back to you?",
    options:["Yes, and it was helpful","Yes, but too pushy","Yes, but too late","No, nobody followed up","Don't remember"]},
  {id:"cl_verbatim", type:"text", required:true,
    ask:"If there were one thing we could change that would have made you say yes — what would it be?",
    hint:"Their words, in one line"},
  {id:"cl_reconsider", type:"single", ask:"Would you consider us again?",
    options:["Yes, right now","Yes, in a few months","Only if something changes","No"]},
  {id:"cl_nps", type:"single", ask:"Would you mention us to another parent, even though you didn't join?",
    options:["Yes, happily","Maybe","No","Would warn them off"]}
];

const REACHED = ["Spoke to them","No answer","Wrong number","Refused to talk","Call back later"];
const REVISIT = [{v:"hot",label:"Hot — chase now"},{v:"warm",label:"Warm — later"},{v:"dead",label:"Dead"}];
const ROLES = ["Sales agent","Senior agent","Team lead","Manager","Quality / audit","Product","Founder"];
const GRADES = ["1","2","3","4","5","6","7","8","9"];
const ETHNICITIES = ["Indian","Pakistani","Afro - American","Bangladeshi","Middle Eastern","Nepali","Native","Unknown",
  "White","Sri Lankan","PreferNotToDisclose","Afganisthani","Asian","Hispanic","Canadian","Eureopeans","NativeAmerican",
  "Mexican","Philippines","Filipino","Spanish","Persian","Chinese","Japanese","German","Irish","Indonesian",
  "Kazakhstani","Turkish","French","Colombian","Mauritian"];

const WHY = {
  fees:"Separates a price problem from a packaging problem. If most parents would pay 75–90% of list, the number is fine and the plan structure isn't.",
  demo:"Demo is the single biggest conversion lever. The failure mode tells you whether to retrain teachers, change the format, or fix the tech.",
  reviews:"Tells you which platform is actually costing you money, and which specific claim to answer.",
  schedule:"Counts demand for slots and formats you don't currently sell — weekend batches, self-paced, shorter sessions.",
  kidint:"The child is the user, the parent is the buyer. What the child likes points straight at curriculum format.",
  curriculum:"The clearest product roadmap input you can get: what they expected and didn't find.",
  competitor:"Builds a battlecard — who wins, at what price, on which feature — and flags which losses are still winnable.",
  visa:"Usually not a lost lead, just an unscheduled one. Measures demand for a pause or freeze option.",
  vacation:"Almost always a timing issue. Sets the callback date and sizes the case for a pause option.",
  age:"Counts the revenue you turn away for want of a program. Enough of these is a business case for a new age band.",
  neuro:"Sensitive, so keep it light and led by the parent. Measures demand for a properly designed inclusive program.",
  language:"Counts which language would unlock which market, and whether bilingual teaching is enough.",
  other:"Catch-all. If this fills up, the reason list itself needs a new option."
};

/* ==========================================================================
   2. TEXT ENGINE — lexicon tone + phrase extraction. No model.
   ========================================================================== */
const LEX = {
  "terrible":-3,"worst":-3,"horrible":-3,"awful":-3,"pathetic":-3,"useless":-3,"waste":-2,"rude":-3,"cheat":-3,
  "angry":-2,"frustrated":-2,"disappointed":-2,"unhappy":-2,"poor":-2,"bad":-2,"worse":-2,"boring":-2,"pushy":-2,
  "aggressive":-2,"expensive":-2,"costly":-2,"overpriced":-3,"hidden":-2,"pressure":-2,"ignored":-2,"forced":-2,
  "not worth":-3,"too high":-2,"no response":-2,"not resolved":-3,"too much":-1,"never again":-3,"gave up":-2,
  "slow":-1,"delay":-1,"problem":-1,"issue":-1,"wrong":-1,"difficult":-1,"confusing":-1,"stuck":-1,"unclear":-1,"hard":-1,
  "excellent":3,"amazing":3,"perfect":3,"love":3,"outstanding":3,"brilliant":3,
  "thank":2,"great":2,"good":2,"happy":2,"satisfied":2,"helpful":2,"smooth":2,"best":2,"polite":2,"patient":2,
  "professional":2,"friendly":2,"appreciate":2,"engaging":2,"fun":2,"interested":1,"quick":1,"easy":1,"clear":1,"fine":1
};
const NEGATORS = new Set(["not","no","never","dont","didnt","isnt","wasnt","cant","couldnt","wont","hardly","barely","without","nothing"]);
const INTENS = {"very":1.5,"extremely":2,"really":1.5,"so":1.3,"too":1.3,"totally":1.5,"completely":1.6,"absolutely":1.8,"quite":1.2,"slightly":0.5};
const NO_STEM = new Set(["goods","news","less","press","address","business","access","class","classes","kids"]);
const STOP = new Set(("a an the and or but if then of to in on for with at by from is are was were be been being am i he she it they we you your my our their this that these those have has had do does did not no so as up out about after before very just also can could will would should there here what when which who why how me him her them us said says told say very really quite too more most much many some any other one two also still yet even than because while during into over under again once her his its s t re ve ll d o m parent mother father mom dad kid kids child children class classes call called calling").split(" "));

const normalize = s => String(s||"").toLowerCase().replace(/[’']/g,"").replace(/[^a-z0-9\s]/g," ").replace(/\s+/g," ").trim();
const words = s => { const n=normalize(s); return n?n.split(" "):[]; };
const wordCount = s => words(s).length;
function lexLookup(t){
  if(t in LEX) return LEX[t];
  if(NO_STEM.has(t)||t.length<5) return null;
  const c=[];
  if(t.endsWith("ies")) c.push(t.slice(0,-3)+"y");
  if(t.endsWith("es")) c.push(t.slice(0,-2));
  if(t.endsWith("s")) c.push(t.slice(0,-1));
  if(t.endsWith("ed")) c.push(t.slice(0,-2), t.slice(0,-1));
  if(t.endsWith("ing")) c.push(t.slice(0,-3), t.slice(0,-3)+"e");
  for(const v of c) if(v in LEX) return LEX[v];
  return null;
}
function tone(text){
  const norm=normalize(text), padded=" "+norm+" ", tk=norm?norm.split(" "):[];
  let score=0; const hits=[];
  for(const [w,v] of Object.entries(LEX)){
    if(!w.includes(" ")) continue;
    let n=0,i=padded.indexOf(" "+w+" ");
    while(i!==-1){n++;i=padded.indexOf(" "+w+" ",i+1);}
    if(n){score+=v*n; hits.push({term:w,weight:v*n});}
  }
  for(let i=0;i<tk.length;i++){
    const w0=lexLookup(tk[i]); if(w0===null||w0===undefined) continue;
    let w=w0,note="";
    for(let b=1;b<=3&&i-b>=0;b++) if(NEGATORS.has(tk[i-b])){w=-w*0.8;note="negated";break;}
    for(let b=1;b<=2&&i-b>=0;b++) if(INTENS[tk[i-b]]){w=w*INTENS[tk[i-b]];note=note||"intensified";break;}
    w=Math.max(-4,Math.min(4,w)); score+=w; hits.push({term:tk[i],weight:w,note});
  }
  score=Math.round(score*10)/10;
  /* per-100-words density so a long note isn't automatically "angrier" */
  const density = tk.length ? Math.round(score/Math.max(tk.length,1)*100*10)/10 : 0;
  return {score, density, label: score<=-1.5?"negative":score>=1.5?"positive":"neutral", hits};
}

/* Sentence scoring for the summarised view. Picks sentences the caller already
   wrote — it never composes new wording. A sentence scores for carrying feeling
   (lexicon hits), for reason-giving words, for numbers, and for being neither
   very short nor rambling. */
const CUES = new Set(("because","since","reason","wanted","want","expected","expect","asked","told","said","instead",
  "unless","if","would","could","should","never","only","too","already","still","again","cannot","cant","need",
  "needed","prefer","rather","hoping","hope","wish","problem","issue").split(" "));
function sentences(text){
  return String(text||"").replace(/\s+/g," ")
    .split(/(?<=[.!?])\s+|\n+/).map(s=>s.trim()).filter(s=>words(s).length>=4);
}
function scoreSentence(s){
  const tk = words(s);
  let sc = 0;
  const t = tone(s);
  sc += t.hits.reduce((a,h)=>a+Math.abs(h.weight),0) * 1.4;
  tk.forEach(w=>{ if(CUES.has(w)) sc += 1; });
  if(/\d/.test(s)) sc += 1.5;
  const n = tk.length;
  sc += n>=8 && n<=32 ? 2 : n<8 ? 0 : 0.5;
  return sc;
}
function summarise(text, howMany){
  const ss = sentences(text);
  if(!ss.length) return "";
  const ranked = ss.map((s,i)=>({s,i,sc:scoreSentence(s)})).sort((a,b)=>b.sc-a.sc)
    .slice(0, howMany||1).sort((a,b)=>a.i-b.i);
  return ranked.map(x=>x.s).join(" ");
}

/* Recurring-phrase extraction across many notes: counts 2- and 3-word
   sequences after stopword removal, then drops any pair fully contained
   in a triple that occurs nearly as often. */
function phrases(texts, minCount){
  minCount = minCount||3;
  const c2={}, c3={}, where={};
  texts.forEach((t,idx)=>{
    const tk = words(t).filter(w=>w.length>2 && !STOP.has(w));
    const seen=new Set();
    for(let i=0;i<tk.length-1;i++){
      const p2=tk[i]+" "+tk[i+1];
      if(!seen.has(p2)){ c2[p2]=(c2[p2]||0)+1; (where[p2]=where[p2]||[]).push(idx); seen.add(p2); }
      if(i<tk.length-2){
        const p3=p2+" "+tk[i+2];
        if(!seen.has(p3)){ c3[p3]=(c3[p3]||0)+1; (where[p3]=where[p3]||[]).push(idx); seen.add(p3); }
      }
    }
  });
  const triples = Object.entries(c3).filter(([,n])=>n>=minCount);
  const covered = new Set();
  triples.forEach(([p,n])=>{ const w=p.split(" ");
    [w[0]+" "+w[1], w[1]+" "+w[2]].forEach(b=>{ if((c2[b]||0) <= n+1) covered.add(b); }); });
  const pairs = Object.entries(c2).filter(([p,n])=>n>=minCount && !covered.has(p));
  return triples.concat(pairs).sort((a,b)=>b[1]-a[1])
    .map(([p,n])=>({phrase:p, count:n, rows:where[p]}));
}

async function boot(){
  if(!configured()){ state.error="unconfigured"; render(); return; }
  try{ sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY); }
  catch(e){ state.error="The Supabase client could not start. Check the URL and key at the top of this file."; render(); return; }

  /* No sign-in screen. If the project allows anonymous sessions we quietly take one,
     which gives each browser a stable id for its own rows. If it doesn't, we carry on
     without a session and rely on the table's own access rules. */
  try{
    const {data:{session}} = await sb.auth.getSession();
    if(session && session.user){ state.me.id = session.user.id; }
    else {
      const {data} = await sb.auth.signInAnonymously();
      if(data && data.user) state.me.id = data.user.id;
    }
  }catch(_){ /* anonymous sessions not enabled — fine, keep going */ }

  const saved = readCaller();
  if(!form.callerName) form.callerName = saved.name || "";

  await loadRows();

      .subscribe();

}

async function loadRows(){

      ? "The database is refusing to share its data with this page. In Supabase, either switch on anonymous sign-ins, or run the SQL in the setup notes that opens the table without a login."
      : "Couldn't read the data: "+error.message;
    render(); return;
  }
  state.error=""; state.rows = (data||[]).map(toApp); state.ready=true; onData();

          <input type="text" id="callbackTime" data-f="callbackTime" value="${esc(form.callbackTime)}" placeholder="e.g. after 6pm their time"></div></div>`:""}

      <div class="field"><label>Reason recorded in Salesforce</label>
        <div class="seg" id="sfSeg">${REASONS.map(r=>`<button type="button" data-v="${r.id}" aria-pressed="${form.sfReason===r.id}">${esc(r.label)}</button>`).join("")}</div></div>

      ${spoke?`
        <div class="field"><label>Real reason, after hearing them out</label>
          <p class="ask"><em>“Before we go further — can you tell me in your own words what made you decide against it?”</em></p>
          <div class="seg" id="actualSeg">${REASONS.map(r=>`<button type="button" data-v="${r.id}" aria-pressed="${form.actualReason===r.id}">${esc(r.label)}</button>`).join("")}</div>
          <p class="hint" style="margin-top:6px">Pick what they actually said, even when it contradicts Salesforce. The gap between the two is measured.</p>
        </div>

        <div style="border-top:1px solid var(--rule); margin:22px 0 18px; padding-top:18px">
          <h2 style="font-size:16px;margin-bottom:4px">Everything they said</h2>
          <p class="hint" style="margin:0 0 10px">Write it long. This is the field the story is built from, so detail here is worth more than anywhere else on the page. Their phrasing, not yours — including the parts that don't fit a category.</p>
          <textarea id="notes" class="big" placeholder="What they told you, in as much detail as you can. Useful things to get down:
· what exactly they compared us to, and what that alternative did better
· what their child said about the class, in the child's words
· what they expected the program to do for their child
· anything they asked for that we don't currently offer
· what we said or did that put them off
· anything they mentioned about money, timing, family situation
· how the conversation ended and what they want from us now">${esc(form.notes)}</textarea>
          <div class="counter${wc<40?" low":""}" id="wc">${wc} ${plural(wc,"word")}${wc<40?" — aim for 60 or more":""}</div>
        </div>

        ${branchId?`<div style="border-top:1px solid var(--rule); margin:20px 0 18px; padding-top:18px">
          <h2 style="font-size:16px;margin-bottom:12px">Probing questions — ${esc(reasonLabel(branchId))}</h2>
          ${probes.map(probeField).join("")}
        </div>
        <div style="border-top:1px solid var(--rule); margin:20px 0 18px; padding-top:18px">
          <h2 style="font-size:16px;margin-bottom:12px">Before you hang up</h2>
          ${CLOSERS.map(probeField).join("")}
          <div class="field"><label>How live is this lead now?</label>
            <div class="seg" id="revisitSeg">${REVISIT.map(r=>`<button type="button" data-v="${r.v}" aria-pressed="${form.revisit===r.v}">${esc(r.label)}</button>`).join("")}</div></div>
          <div class="row"><div class="field"><label for="callback">Call back on</label><input type="date" id="callback" data-f="callback" value="${esc(form.callback)}"></div>
            <div class="field"><label for="agentNote">Internal note <span style="font-weight:400">(not analysed)</span></label>
              <input type="text" id="agentNote" data-f="agentNote" value="${esc(form.agentNote)}" placeholder="Anything for whoever picks this up next"></div></div>
        </div>`:`<p class="hint">Pick the real reason above to load the probing questions.</p>`}
      `:`<div class="field"><label for="notes">Anything worth noting</label>
          <textarea id="notes" placeholder="Wrong number, who picked up, when to try again…">${esc(form.notes)}</textarea></div>
        <p class="hint" style="margin-bottom:18px">No conversation happened, so only the outcome is saved. It still counts towards reach rate.</p>`}

      ${state.canWrite===false && !usingLocal?`<div class="banner">You have view-only access, so calls can't be saved from here.</div>`:""}
      <button class="btn" id="saveCall">Save debrief</button>
    </section>

    <aside id="side" style="position:sticky;top:74px">${sideHtml()}</aside>
  </div>`;
}

function sideHtml(){
  const branchId=form.actualReason||form.sfReason;
  const mismatch=form.sfReason&&form.actualReason&&form.sfReason!==form.actualReason;
  const t=tone(form.notes+" "+(form.answers.cl_verbatim||""));
  const q=num(form.answers.fee_quoted), a=num(form.answers.fee_accept);
  const gap=(q&&a)?Math.round((1-a/q)*100):null;
  const cp=num(form.answers.comp_price);
  const wc=wordCount(form.notes);
  return `
  ${mismatch?`<div class="panel" style="border-left:3px solid var(--warn);border-radius:0 6px 6px 0;margin-bottom:12px">
    <h3 style="font-family:var(--sans);font-size:13px;color:var(--ink-2);margin-bottom:6px">Salesforce was wrong here</h3>
    <p style="margin:0;font-size:13.5px">Filed as <b>${esc(reasonLabel(form.sfReason))}</b>, actually <b>${esc(reasonLabel(form.actualReason))}</b>. This gets counted.</p></div>`:""}

  ${gap!==null?`<div class="panel" style="margin-bottom:12px">
    <h3 style="font-family:var(--sans);font-size:13px;color:var(--ink-2);margin-bottom:6px">Price gap</h3>
    <p style="margin:0;font-size:14px">Yes at <b>${a}</b> against our <b>${q}</b> — a <b style="color:${gap>30?"var(--neg)":"var(--warn)"}">${gap}%</b> gap.${gap<=25?" Inside normal discount range.":" A real pricing signal, not a haggle."}</p></div>`:""}

  ${cp?`<div class="panel" style="margin-bottom:12px">
    <h3 style="font-family:var(--sans);font-size:13px;color:var(--ink-2);margin-bottom:6px">Competitor price</h3>
    <p style="margin:0;font-size:14px">${esc(form.answers.comp_name||"Competitor")} at <b>${cp}</b>${q?` against our ${q}`:""}.</p></div>`:""}

  <div class="panel" style="margin-bottom:12px">
    <h3 style="font-family:var(--sans);font-size:13px;color:var(--ink-2);margin-bottom:8px">How this note reads</h3>
    <p style="margin:0 0 8px;font-size:14px"><b>${wc}</b> ${plural(wc,"word")}${wc>=60?" — good detail":wc>=25?" — usable":" — thin"}
      ${wc?` · tone <span style="text-transform:capitalize;color:${t.label==="negative"?"var(--neg)":t.label==="positive"?"var(--pos)":"var(--neu)"}"><b>${t.label}</b></span>`:""}</p>
    ${t.hits.length?`<div style="display:flex;flex-wrap:wrap;gap:5px">${t.hits.slice(0,14).map(h=>`<span class="chip" style="${h.weight<0?"background:var(--neg-soft);color:var(--neg);border-color:transparent":"background:var(--pos-soft);color:var(--pos);border-color:transparent"}">${esc(h.term)} ${h.weight>0?"+":""}${h.weight.toFixed(1)}</span>`).join("")}</div>`
      :`<p class="hint" style="margin:0">Scoring words show up here as you type.</p>`}
  </div>

  ${branchId?`<div class="panel"><h3 style="font-family:var(--sans);font-size:13px;color:var(--ink-2);margin-bottom:8px">Why we ask these</h3>
    <p style="margin:0;font-size:13px;color:var(--ink-2)">${esc(WHY[branchId]||"")}</p></div>`:""}`;
}

/* ==========================================================================
   6. STORY — template-driven narrative built from counted facts
   ========================================================================== */
const storyFilter = {days:30, reason:"", market:""};

function scopeRows(){
  const cut = storyFilter.days ? Date.now()-storyFilter.days*864e5 : 0;
  return state.rows.filter(r=>{
    if(cut && r.ts < cut) return false;
    if(storyFilter.market && r.market!==storyFilter.market) return false;
    if(storyFilter.reason && (r.actualReason||r.sfReason)!==storyFilter.reason) return false;
    return true;
  });
}

function buildStory(){
  const all = scopeRows(), D = done(all);
  if(!D.length) return null;
  const S = [];
  const dates = all.map(callDateOf).sort();
  const callers = [...new Set(all.map(callerOf))];
  const mism = D.filter(r=>r.sfReason&&r.actualReason&&r.sfReason!==r.actualReason);
  const mixC = D.reduce((c,r)=>{const k=r.actualReason||r.sfReason; if(k) c[k]=(c[k]||0)+1; return c;},{});
  const mix = sortCount(mixC);
  const notes = D.map(fullText).filter(t=>wordCount(t)>=10);
  const ph = phrases(notes, Math.max(3, Math.round(notes.length*0.12)));

  /* --- what we did --- */
  const p1 = [];
  p1.push(`Between ${fmtD(dates[0])} and ${fmtD(dates[dates.length-1])}, ${callers.length} ${plural(callers.length,"caller")} worked through ${all.length} ${plural(all.length,"lead")} that had been closed as not interested. ${D.length} parents actually spoke to us — a reach rate of ${pct(D.length,all.length)}%.`);
  const refused = all.filter(r=>r.reached==="Refused to talk").length;
  const wrong = all.filter(r=>r.reached==="Wrong number").length;
  if(refused||wrong) p1.push(`${refused?`${refused} refused to talk`:""}${refused&&wrong?" and ":""}${wrong?`${wrong} ${plural(wrong,"number was","numbers were")} wrong`:""}, which is worth watching on its own: ${wrong>D.length*0.15?"bad contact data is costing you a meaningful share of this exercise.":"contact data is holding up reasonably well."}`);
  p1.push(`Notes were written on ${notes.length} of those conversations, averaging ${Math.round(notes.reduce((s,t)=>s+wordCount(t),0)/Math.max(notes.length,1))} words each.`);
  S.push({h:"What we did", paras:p1});

  /* --- what we heard --- */
  const p2=[];
  const top3 = mix.slice(0,3);
  p2.push(`The reasons parents gave, in their own words, come out as: ${top3.map(([k,v])=>`${reasonLabel(k).toLowerCase()} (${v}, ${pct(v,D.length)}%)`).join("; ")}${mix.length>3?`; and ${mix.length-3} other ${plural(mix.length-3,"reason")} below that`:""}.`);
  if(mism.length){
    const mtop = topOf(mism.reduce((c,r)=>{const k=r.sfReason+"→"+r.actualReason; c[k]=(c[k]||0)+1; return c;},{}));
    const [a,b] = mtop[0].split("→");
    p2.push(`${mism.length} of the ${D.length} parents described something different from what Salesforce recorded at drop-off — ${pct(mism.length,D.length)}% of the sample. The commonest swap was ${reasonLabel(a).toLowerCase()} on the record turning out to be ${reasonLabel(b).toLowerCase()} on the phone, which happened ${mtop[1]} ${plural(mtop[1],"time")}.`);
    p2.push(pct(mism.length,D.length)>=25
      ? `At that rate the Salesforce field is not a safe basis for a pricing or product decision on its own.`
      : `That rate is low enough that the Salesforce field is broadly directionally right, but the detail underneath it is where the value sits.`);
  }
  if(ph.length){
    p2.push(`Reading across the notes, the phrases that keep coming back are: ${ph.slice(0,6).map(p=>`“${p.phrase}” (${p.count})`).join(", ")}. These are counted by exact repetition across separate conversations, so they are what parents are literally saying, not a summary of it.`);
  }
  S.push({h:"What we heard", paras:p2});

  /* --- when it went wrong --- */
  const mom = countOpts(D,"cl_moment");
  const p3=[]; const momTop=topOf(mom);
  if(momTop){
    const momTotal = Object.values(mom).reduce((a,b)=>a+b,0);
    p3.push(`Asked when they decided against us, the largest group — ${momTop[1]} of ${momTotal} who answered, ${pct(momTop[1],momTotal)}% — said it was ${momTop[0].toLowerCase()}.`);
    const order = sortCount(mom).slice(1,4);
    if(order.length) p3.push(`Behind that: ${order.map(([k,v])=>`${k.toLowerCase()} (${v})`).join(", ")}.`);
    const early = (mom["Before the demo even happened"]||0)+(mom["During the demo"]||0);
    const late = (mom["After the demo, thinking it over"]||0)+(mom["After speaking to another provider"]||0)+(mom["We never really decided, it just faded"]||0);
    if(early>late) p3.push(`The loss is happening early, before the sales conversation gets going. Work spent on follow-up sequences will not move this; the demo and the first impression will.`);
    else if(late>early) p3.push(`Most of these were still open after the demo and drifted away afterwards. That is the cheapest kind of loss to fix, because the interest was real.`);
  }
  const fu = countOpts(D,"cl_followup");
  const noFu = fu["No, nobody followed up"]||0, pushy = fu["Yes, but too pushy"]||0, late2 = fu["Yes, but too late"]||0;
  const fuTotal = Object.values(fu).reduce((a,b)=>a+b,0);
  if(fuTotal){
    if(noFu/fuTotal>=0.3) p3.push(`${noFu} of ${fuTotal} said nobody from our side ever came back to them after they went quiet. That is a process gap, not a market problem.`);
    if(pushy/fuTotal>=0.2) p3.push(`${pushy} described the follow-up as too pushy, and ${late2} as too late — the cadence is landing wrong at both ends.`);
  }
  if(p3.length) S.push({h:"When it went wrong", paras:p3});

  /* --- what went wrong, reason by reason --- */
  const p4=[]; const bullets=[];
  top3.forEach(([rid,n])=>{
    const g = D.filter(r=>(r.actualReason||r.sfReason)===rid);
    bullets.push(`<b>${esc(reasonLabel(rid))}</b> — ${n} ${plural(n,"parent")}. ${esc(reasonDetail(rid,g))}`);
  });
  if(bullets.length) p4.push({list:bullets});
  S.push({h:"What went wrong", paras:[], list:bullets});

  /* --- what we could do --- */
  const recs = recommendations(D);
  S.push({h:"What we could do about it", paras: recs.length?[]:["No recommendation rule has enough data to fire yet. Most need five to ten debriefs within a single reason."], list: recs.map(r=>`<b>${esc(r.h)}</b> — ${esc(r.p)} <span class="hint">${esc(r.why)}</span>`)});

  /* --- voices --- */
  const scored = D.map((r,i)=>({r, key:r.id||("i"+i), t:fullText(r), s:tone(fullText(r))})).filter(x=>wordCount(x.t)>=12);
  const picked=[], usedKeys=new Set(), usedText=new Set();
  const take = (arr,n)=>arr.forEach(x=>{
    if(picked.length>=n || usedKeys.has(x.key)) return;
    const txt = firstSentences(ansOf(x.r,"cl_verbatim")||x.t, 240);
    const fp = normalize(txt).slice(0,60);
    if(usedText.has(fp)) return;
    picked.push({x, txt}); usedKeys.add(x.key); usedText.add(fp);
  });
  take(scored.slice().sort((a,b)=>a.s.density-b.s.density),2);
  top3.forEach(([rid])=> take(scored.filter(x=>(x.r.actualReason||x.r.sfReason)===rid), picked.length+1));
  take(scored.slice().sort((a,b)=>wordCount(b.t)-wordCount(a.t)),6);
  S.push({h:"In their words", quotes:picked.slice(0,5).map(p=>({
    text: p.txt,
    meta: `${reasonLabel(p.x.r.actualReason||p.x.r.sfReason)} · ${p.x.r.market||"market not recorded"} · ${fmtD(callDateOf(p.x.r))} · noted by ${callerOf(p.x.r)}`
  }))});

  return {sections:S, D, all, ph};
}

function firstSentences(t, cap){
  t = String(t||"").trim().replace(/\s+/g," ");
  if(t.length<=cap) return t;
  const cut = t.slice(0,cap);
  const stop = Math.max(cut.lastIndexOf(". "), cut.lastIndexOf("? "), cut.lastIndexOf("! "));
  return (stop>60 ? cut.slice(0,stop+1) : cut.trim()+"…");
}

function reasonDetail(rid, g){
  const t = q => { const x=topOf(countOpts(g,q)); return x?x[0]:null; };
  const c = q => { const x=topOf(countOpts(g,q)); return x?x[1]:0; };
  switch(rid){
    case "fees": {
      const pairs=g.map(r=>({q:num(ansOf(r,"fee_quoted")),a:num(ansOf(r,"fee_accept"))})).filter(p=>p.q&&p.a);
      const mr=median(pairs.map(p=>p.a/p.q));
      const fix=countOpts(g,"fee_structure")["Yes, that would have closed it"]||0;
      return `${mr!==null?`Median parent would have paid ${Math.round(mr*100)}% of what we quoted. `:""}What felt heaviest was ${String(t("fee_heavy")||"unspecified").toLowerCase()}${c("fee_heavy")?` (${c("fee_heavy")} of them)`:""}. ${fix} said a monthly plan or smaller starter pack at the same rate would have closed it.`;
    }
    case "demo": return `The commonest complaint was ${String(t("demo_what")||"unspecified").toLowerCase()} (${c("demo_what")}). ${countOpts(g,"demo_retry")["Yes"]||0} would still take a second demo with a different teacher.`;
    case "reviews": return `Most first saw it on ${t("rev_where")||"an unrecorded platform"} (${c("rev_where")}), and the concern was usually ${String(t("rev_what")||"unspecified").toLowerCase()}. ${countOpts(g,"rev_asked")["No, nobody raised it"]||0} said we never addressed it with them.`;
    case "schedule": return `The slot they actually wanted was ${String(t("sch_slot")||"unrecorded").toLowerCase()} (${c("sch_slot")}), and ${countOpts(g,"sch_format")["Self-paced would work"]||0} would have taken a self-paced option instead of a live class.`;
    case "kidint": return `Children most often called it ${String(t("kid_why")||"unspecified").toLowerCase()} (${c("kid_why")}). What they are drawn to instead is ${String(t("kid_likes")||"unrecorded").toLowerCase()}, and the format most likely to have held them was ${String(t("kid_format")||"unrecorded").toLowerCase()}.`;
    case "curriculum": return `The gap named most was ${String(t("cur_gap")||"unspecified").toLowerCase()} (${c("cur_gap")}), and what they were actually buying was ${String(t("cur_outcome")||"unrecorded").toLowerCase()}.`;
    case "competitor": {
      const names={}; g.forEach(r=>{const n=String(ansOf(r,"comp_name")||"").trim(); if(n) names[n.toLowerCase()]=(names[n.toLowerCase()]||0)+1;});
      const tn=topOf(names); const mp=median(g.map(r=>num(ansOf(r,"comp_price"))).filter(Boolean));
      return `${tn?`${tn[0].replace(/\b\w/g,ch=>ch.toUpperCase())} took ${tn[1]} of them`:"No single provider dominates"}${mp?`, at a median of ${mp}`:""}. The reason given most was ${String(t("comp_why")||"unrecorded").toLowerCase()}.`;
    }
    case "visa": return `${countOpts(g,"visa_pause")["Yes, that solves it"]||0} said a pause-and-resume option would have solved it outright. Most expect clarity ${String(t("visa_when")||"at an unknown point").toLowerCase()}.`;
    case "vacation": return `Timing, not intent. ${countOpts(g,"vac_option")["Start now, pause later"]||0} would have started anyway with a pause built in.`;
    case "age": {
      const yes=g.filter(r=>ansOf(r,"age_would")==="Yes").length;
      const ages=g.map(r=>num(ansOf(r,"age_actual"))).filter(x=>x!=null);
      return `${yes} said they would enrol if a program existed for their child's age${ages.length?`, clustered around ${median(ages)} years`:""}. These are being disqualified rather than served.`;
    }
    case "neuro": return `What they need most is ${String(t("neuro_support")||"unrecorded").toLowerCase()} (${c("neuro_support")}). ${g.filter(r=>String(ansOf(r,"neuro_pay")||"").startsWith("Yes")).length} would take a program designed around it.`;
    case "language": {
      const l={}; g.forEach(r=>{const x=String(ansOf(r,"lang_pref")||"").trim(); if(x) l[x.toLowerCase()]=(l[x.toLowerCase()]||0)+1;});
      const tl=topOf(l);
      return `${tl?`${tl[0].replace(/\b\w/g,ch=>ch.toUpperCase())} was asked for ${tl[1]} ${plural(tl[1],"time")}`:"No single language dominates"}. The barrier was mostly ${String(t("lang_who")||"unrecorded").toLowerCase()}, and ${countOpts(g,"lang_fix")["Yes"]||0} said a bilingual teacher would be enough.`;
    }
    default: return `See the individual notes for detail.`;
  }
}

/* shared recommendation rules, used by Story and Signals */
function recommendations(D){
  const out=[];
  const feeRows=D.filter(r=>(r.actualReason||r.sfReason)==="fees"||num(ansOf(r,"fee_accept"))!==null);
  const pricePairs=feeRows.map(r=>({q:num(ansOf(r,"fee_quoted")),a:num(ansOf(r,"fee_accept"))})).filter(p=>p.q&&p.a&&p.q>0);
  const medRatio=median(pricePairs.map(p=>p.a/p.q));
  const nearMiss=pricePairs.filter(p=>p.a/p.q>=0.75);
  const recoverable=nearMiss.reduce((s,p)=>s+p.a,0);
  const structureFix=countOpts(feeRows,"fee_structure")["Yes, that would have closed it"]||0;
  if(pricePairs.length>=5&&medRatio!==null){
    out.push(medRatio>=0.75
      ? {cls:"act-price",h:"Change the packaging before you change the price",
         p:`Across ${pricePairs.length} fee objections the median parent would have paid ${Math.round(medRatio*100)}% of list, and ${nearMiss.length} sat at 75% or above — ${Math.round(recoverable).toLocaleString()} of stated willingness to pay walking out. A smaller starter pack or a monthly plan reaches that group without discounting the rate.`,
         why:`Rule: 5+ fee objections with both prices captured, median accept-to-quote ratio at or above 0.75.`}
      : {cls:"act-price",h:"This is a genuine price objection, not a discount ask",
         p:`Median parent would pay only ${Math.round(medRatio*100)}% of list across ${pricePairs.length} objections. A payment-plan change will not close that gap; the price point or the package size has to move.`,
         why:`Rule: 5+ fee objections, median accept-to-quote ratio below 0.75.`});
  }
  if(feeRows.length>=5&&structureFix/feeRows.length>=0.4) out.push({cls:"act-price",h:"A monthly or starter plan closes a chunk of these",
    p:`${structureFix} of ${feeRows.length} parents who called the price high said a monthly plan or smaller starter pack at the same per-class rate would have closed it. No discount required.`,
    why:`Rule: 40% or more of fee objections answered yes on the payment-structure question.`});
  const comps={}; const ourMed=median(D.map(r=>num(ansOf(r,"fee_quoted"))).filter(Boolean));
  D.forEach(r=>{ const raw=String(ansOf(r,"comp_name")||"").trim(); if(!raw) return;
    const k=raw.toLowerCase(); (comps[k]=comps[k]||{n:0,prices:[],why:{},winnable:0,name:raw});
    comps[k].n++; const p=num(ansOf(r,"comp_price")); if(p) comps[k].prices.push(p);
    (ansOf(r,"comp_why")||[]).forEach(w=>comps[k].why[w]=(comps[k].why[w]||0)+1);
    const sw=ansOf(r,"comp_switch")||[];
    if(sw.length&&!(sw.length===1&&sw[0]==="Nothing, we're settled")) comps[k].winnable++; });
  Object.values(comps).filter(c=>c.n>=3).sort((a,b)=>b.n-a.n).forEach(c=>{
    const mp=median(c.prices); const tw=topOf(c.why);
    out.push({cls:"act-price",h:`${c.name} is taking your leads`,
      p:`${c.n} parents went there${mp?`, paying a median of ${mp}${ourMed?` against your ${ourMed}`:""}`:""}. Reason given most: ${tw?tw[0].toLowerCase():"unclear"}. ${c.winnable} named something specific that would bring them back, so this is a battlecard and a call list, not just a loss.`,
      why:`Rule: a named competitor appearing in 3 or more debriefs.`});
  });
  const ageYes=D.filter(r=>(r.actualReason||r.sfReason)==="age"&&ansOf(r,"age_would")==="Yes");
  if(ageYes.length>=5){
    const ages=ageYes.map(r=>num(ansOf(r,"age_actual"))).filter(x=>x!=null);
    out.push({cls:"act-product",h:"There is a program you don't sell and parents are asking for it",
      p:`${ageYes.length} parents outside the age range said they would enrol if one existed${ages.length?`, clustered around ${median(ages)} years old`:""}. These leads are currently disqualified rather than served, and each one also arrived with intent already formed.`,
      why:`Rule: 5 or more age-disqualified parents answering yes to the would-you-enrol question.`});
  }
  const langRows=D.filter(r=>(r.actualReason||r.sfReason)==="language");
  if(langRows.length>=4){
    const l={}; langRows.forEach(r=>{const x=String(ansOf(r,"lang_pref")||"").trim(); if(x){const k=x.toLowerCase().replace(/\b\w/g,c=>c.toUpperCase()); l[k]=(l[k]||0)+1;}});
    const tl=topOf(l); const bil=countOpts(langRows,"lang_fix")["Yes"]||0;
    out.push({cls:"act-product",h:"Language is closing a market for you",
      p:`${langRows.length} parents dropped on language${tl?`, most asking for ${tl[0]} (${tl[1]})`:""}. ${bil} said a teacher who can switch between that language and English would be enough — test that before committing to full localisation.`,
      why:`Rule: 4 or more debriefs where the real reason was language.`});
  }
  const demoRows=D.filter(r=>(r.actualReason||r.sfReason)==="demo");
  const demoTop=topOf(countOpts(demoRows,"demo_what"));
  if(demoRows.length>=5&&demoTop&&demoTop[1]/demoRows.length>=0.3) out.push({cls:"act-ops",h:"One demo failure mode dominates",
    p:`“${demoTop[0]}” came up in ${demoTop[1]} of ${demoRows.length} bad-demo calls. ${countOpts(demoRows,"demo_retry")["Yes"]||0} of these parents would still take a second demo with a different teacher — a live retry list, not a lost list.`,
    why:`Rule: 5+ demo debriefs with one failure mode in 30% or more of them.`});
  const mism=D.filter(r=>r.sfReason&&r.actualReason&&r.sfReason!==r.actualReason);
  if(D.length>=10&&mism.length/D.length>=0.25) out.push({cls:"act-ops",h:"Your Salesforce reasons are unreliable",
    p:`${mism.length} of ${D.length} parents gave a different reason on the call than the one recorded at drop-off. Retrain on reason capture, or the reporting built on that field keeps pointing the wrong way.`,
    why:`Rule: 10+ debriefs with a recorded-versus-actual mismatch in 25% or more.`});
  const revRows=D.filter(r=>(r.actualReason||r.sfReason)==="reviews");
  const revTop=topOf(countOpts(revRows,"rev_where"));
  if(revRows.length>=4&&revTop){ const wt=topOf(countOpts(revRows,"rev_what"));
    out.push({cls:"act-ops",h:`${revTop[0]} is where the damage is happening`,
      p:`${revTop[1]} of ${revRows.length} review-driven losses started there, and the concern raised most was ${wt?wt[0].toLowerCase():"unclear"}. ${countOpts(revRows,"rev_asked")["No, nobody raised it"]||0} said nobody from our side ever addressed it with them.`,
      why:`Rule: 4 or more review-driven losses, ranked by where they were seen.`}); }
  const noFu=countOpts(D,"cl_followup")["No, nobody followed up"]||0;
  const fuTotal=Object.values(countOpts(D,"cl_followup")).reduce((a,b)=>a+b,0);
  if(fuTotal>=8&&noFu/fuTotal>=0.3) out.push({cls:"act-ops",h:"A third of them were never followed up at all",
    p:`${noFu} of ${fuTotal} parents said nobody came back to them after they went quiet. Before spending on new leads, work out why these ones were dropped.`,
    why:`Rule: 8+ answers on the follow-up question with 30% or more saying nobody followed up.`});
  const pauseYes=(countOpts(D,"visa_pause")["Yes, that solves it"]||0)+(countOpts(D,"vac_option")["Start now, pause later"]||0);
  if(pauseYes>=5) out.push({cls:"act-product",h:"A pause option would recover the timing losses",
    p:`${pauseYes} parents lost to travel, visas or job moves said an option to freeze the course and keep unused classes would have solved it. This is a policy change, not a build.`,
    why:`Rule: 5 or more parents answering that a pause would have solved it.`});
  return out;
}

function storyMarkdown(){
  const st=buildStory(); if(!st) return "No completed debriefs in this period.";
  const strip = s => String(s).replace(/<[^>]+>/g,"")
    .replace(/&#39;/g,"'").replace(/&quot;/g,'"').replace(/&lt;/g,"<").replace(/&gt;/g,">").replace(/&amp;/g,"&");
  let md = `# Why we lost these parents\n\n_${st.D.length} interviews · ${storyFilter.days?`last ${storyFilter.days} days`:"all time"} · generated ${new Date().toLocaleString()}_\n\n`;
  md += `> Assembled by template from counted answers and repeated phrases in the call notes. Every number is a tally. No language model was used.\n\n`;
  st.sections.forEach(s=>{
    md += `## ${s.h}\n\n`;
    (s.paras||[]).forEach(p=> md += strip(p)+"\n\n");
    (s.list||[]).forEach(li=> md += "- "+strip(li)+"\n");
    if(s.list&&s.list.length) md += "\n";
    (s.quotes||[]).forEach(q=> md += `> “${q.text}”\n> — ${q.meta}\n\n`);
  });
  return md;
}

function priceChart(pairs){
  const W=680,H=180,pad=30;
  const data=pairs.map(p=>p.a/p.q).sort((a,b)=>b-a).slice(0,40);
  const bw=Math.max(4,Math.min(22,(W-pad*2)/data.length-4)), step=(W-pad*2)/data.length;
  let bars="";
  data.forEach((r,i)=>{const h=Math.min(1.2,r)*(H-40), x=pad+i*step+(step-bw)/2, y=H-24-h;
    const col=r>=0.9?"var(--pos)":r>=0.75?"var(--warn)":"var(--neg)";
    bars+=`<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${bw.toFixed(1)}" height="${h.toFixed(1)}" rx="1" style="fill:${col}"></rect>`;});
  const y100=H-24-(H-40), y75=H-24-0.75*(H-40);
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto" role="img" aria-label="Acceptable price as a share of quoted price">
    <line x1="${pad-8}" y1="${y100}" x2="${W-pad}" y2="${y100}" style="stroke:var(--ink-3);stroke-dasharray:3 3"></line>
    <text x="${W-pad+2}" y="${y100+4}" style="fill:var(--ink-3);font:10.5px var(--sans)">list</text>
    <line x1="${pad-8}" y1="${y75}" x2="${W-pad}" y2="${y75}" style="stroke:var(--rule)"></line>
    <text x="${W-pad+2}" y="${y75+4}" style="fill:var(--ink-3);font:10.5px var(--sans)">75%</text>
    <line x1="${pad-8}" y1="${H-24}" x2="${W-pad}" y2="${H-24}" style="stroke:var(--rule)"></line>
    ${bars}<text x="${pad-8}" y="${H-8}" style="fill:var(--ink-3);font:10.5px var(--sans)">one bar = one parent</text></svg>`;
}

    const c=byCaller[k]; c.n++; if(r.callerRole) c.role=r.callerRole; if(callerOf(r)) c.name=callerOf(r);
    if(r.reached==="Spoke to them"){ c.reached++;
      const w=wordCount(fullText(r)); c.words.push(w); if(w<25) c.thin++;
      if(r.sfReason&&r.actualReason&&r.sfReason!==r.actualReason) c.mism++; }

function gradeMatrix(D){
  const rows = D.filter(r=>r.kidGrade);
  if(!rows.length) return `<p class="hint">No grades recorded yet. Once callers fill in the grade dropdown this fills in.</p>`;
  const grades = GRADES.filter(g=>rows.some(r=>r.kidGrade===g));
  const reasons = [...new Set(rows.map(r=>r.actualReason||r.sfReason))].filter(Boolean);
  const cell={}; let max=0;
  rows.forEach(r=>{ const k=(r.actualReason||r.sfReason)+"|"+r.kidGrade;
    cell[k]=(cell[k]||0)+1; if(cell[k]>max) max=cell[k]; });
  const rowTotal = rid => grades.reduce((s,g)=>s+(cell[rid+"|"+g]||0),0);
  const colTotal = g => reasons.reduce((s,rid)=>s+(cell[rid+"|"+g]||0),0);
  const ordered = reasons.slice().sort((a,b)=>rowTotal(b)-rowTotal(a));
  return `<div class="scroll"><table>
    <thead><tr><th>Real reason</th>${grades.map(g=>`<th style="text-align:center">Gr ${g}</th>`).join("")}<th style="text-align:center">All</th></tr></thead>
    <tbody>${ordered.map(rid=>`<tr><td><b>${esc(reasonLabel(rid))}</b></td>
      ${grades.map(g=>{const v=cell[rid+"|"+g]||0;
        return `<td style="text-align:center;background:rgba(120,140,130,${max?(v/max*0.55).toFixed(2):0})">${v||""}</td>`;}).join("")}
      <td style="text-align:center"><b>${rowTotal(rid)}</b></td></tr>`).join("")}
      <tr><td class="hint">Interviews</td>${grades.map(g=>`<td style="text-align:center" class="hint">${colTotal(g)}</td>`).join("")}
        <td style="text-align:center" class="hint">${rows.length}</td></tr>
    </tbody></table></div>
    ${gradeNotes(ordered, grades, cell, colTotal, rowTotal, rows.length)}`;
}
function gradeNotes(reasons, grades, cell, colTotal, rowTotal, total){
  /* flags any reason that runs at least 1.6x its overall share inside one grade,
     with at least 3 cases, so the table isn't left for the reader to eyeball */
  const out=[];
  reasons.forEach(rid=>{
    const share = rowTotal(rid)/total;
    grades.forEach(g=>{
      const n = cell[rid+"|"+g]||0, ct = colTotal(g);
      if(n>=3 && ct>=5 && (n/ct) >= share*1.6)
        out.push(`Grade ${g}: ${esc(reasonLabel(rid).toLowerCase())} accounts for ${pct(n,ct)}% of losses against ${Math.round(share*100)}% overall.`);
    });
  });
  if(!out.length) return `<p class="hint" style="margin-top:10px">No grade is yet out of line with the overall pattern by enough to call it out. Needs at least five interviews in a grade.</p>`;
  return `<ul style="margin:12px 0 0;padding-left:20px;font-size:14px">${out.slice(0,6).map(s=>`<li style="margin-bottom:6px">${s}</li>`).join("")}</ul>`;
}

function dayChart(keys,days){
  if(!keys.length) return `<p class="hint">No data.</p>`;
  const W=640,H=170,pad=26, max=Math.max(...keys.map(k=>days[k]),1);
  const step=(W-pad*2)/keys.length, bw=Math.min(34,step-6);
  let bars="";
  keys.forEach((k,i)=>{const h=days[k]/max*(H-46), x=pad+i*step+(step-bw)/2, y=H-24-h;
    bars+=`<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${bw.toFixed(1)}" height="${h.toFixed(1)}" rx="1" style="fill:var(--ink)"></rect>`;
    bars+=`<text x="${(x+bw/2).toFixed(1)}" y="${H-8}" text-anchor="middle" style="fill:var(--ink-3);font:10px var(--sans)">${fmtD(k)}</text>`;});
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto" role="img" aria-label="Calls per day">
    <line x1="${pad-6}" y1="${H-24}" x2="${W-pad+6}" y2="${H-24}" style="stroke:var(--rule)"></line>
    <text x="${pad-10}" y="18" style="fill:var(--ink-3);font:10.5px var(--sans)">${max}</text>${bars}</svg>`;
}

function repoDigest(rows,ph){

  const tones = rows.map(r=>tone(fullText(r)).label);
  const neg = tones.filter(t=>t==="negative").length, pos = tones.filter(t=>t==="positive").length;
  const callers = [...new Set(rows.map(callerOf))];
  const wordsTotal = rows.reduce((s,r)=>s+wordCount(fullText(r)),0);
  const grades = sortCount(rows.reduce((c,r)=>{ if(r.kidGrade) c["Grade "+r.kidGrade]=(c["Grade "+r.kidGrade]||0)+1; return c; },{}));
  return `<div style="border:1px solid var(--rule);border-left:3px solid var(--ink);border-radius:0 5px 5px 0;padding:14px 16px;margin:16px 0 14px;background:var(--panel)">

    <p style="margin:0 0 8px;font-size:14.5px;line-height:1.6">
      ${rows.length} ${plural(rows.length,"note")} from ${callers.length} ${plural(callers.length,"caller")}, ${wordsTotal.toLocaleString()} words in total.
      ${mix.length?`The reason given most is ${esc(mix[0][0].toLowerCase())} (${mix[0][1]}${mix.length>1?`, then ${esc(mix[1][0].toLowerCase())} with ${mix[1][1]}`:""}).`:""}
      ${neg?`${neg} of them read as negative and ${pos} as positive on the word lexicon.`:""}
      ${grades.length?`Most are ${esc(grades[0][0].toLowerCase())} ${plural(grades[0][1],"child","children")} (${grades[0][1]}).`:""}
    </p>
    ${ph.length?`<p style="margin:0;font-size:13.5px;color:var(--ink-2)">Wording that repeats across separate conversations: ${ph.slice(0,5).map(p=>`“${esc(p.phrase)}” (${p.count})`).join(", ")}.</p>`:""}
    <p class="hint" style="margin:9px 0 0">Counted from these notes only — change a filter above and this changes with it.</p>
  </div>`;
}
function highlight(text,q){
  const e=esc(text);
  if(!q||q.length<2) return e;
  try{ const rx=new RegExp("("+q.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+")","ig"); return e.replace(rx,"<mark>$1</mark>"); }
  catch(_){ return e; }
}
function renderAnswers(r){
  const a=r.answers||{}; const keys=Object.keys(a).filter(k=>a[k]!==""&&a[k]!=null&&!(Array.isArray(a[k])&&!a[k].length));
  if(!keys.length) return "";
  const lookup={}; Object.values(PROBES).flat().concat(CLOSERS).forEach(q=>lookup[q.id]=q.ask||q.id);
  return `<div style="margin-top:12px;border-top:1px solid var(--rule);padding-top:10px">
    <table>${keys.map(k=>`<tr><td style="color:var(--ink-3);width:45%">${esc(lookup[k]||k)}</td>
      <td><b>${esc(Array.isArray(a[k])?a[k].join(", "):a[k])}</b></td></tr>`).join("")}</table>
    ${r.note?`<p class="hint" style="margin:10px 0 0">Internal note: ${esc(r.note)}</p>`:""}</div>`;
}

    notes: form.notes.trim(),
    answers: spoke?{...form.answers}:{},
    revisit: spoke?form.revisit:(form.reached==="Call back later"?"warm":"dead"),
    callback: form.callback||form.answers.vac_back||"",
    callbackTime: form.callbackTime.trim(),
    note: form.agentNote.trim(),
    tone: spoke?(()=>{const t=tone(form.notes); return {score:t.score,density:t.density,label:t.label};})():null
  };
  const btn=$("#saveCall"); btn.disabled=true;
  try{
    await addRow(doc);
    toast(spoke?"Debrief saved — "+reasonLabel(doc.actualReason):"Outcome saved");
    const keepName=form.callerName, keepRole=form.callerRole, keepDate=form.callDate;
    form.sfReason=""; form.actualReason=""; form.reached="Spoke to them"; form.revisit="warm";
    form.answers={}; form.notes=""; FORM_FIELDS.forEach(k=>form[k]="");
    form.callerName=keepName; form.callerRole=keepRole; form.callDate=keepDate;
    render(); window.scrollTo({top:0,behavior:"smooth"});
  }catch(err){
    toast(err.code==="invalid_argument"?"This account can't save debriefs here"
      :err.code==="quota_exceeded"?"The store is full — export and clear old records"
      :"Couldn't save: "+(err.code||"unknown"));
  }finally{ btn.disabled=false; }
}

function saveFile(filename,data,mime){
  if(downloadsCap){
    downloadsCap.save({filename,data}).then(()=>toast("Saved")).catch(err=>{ if(err.code!=="declined") toast("Save failed: "+(err.code||"unknown")); });
  }else{
    const a=document.createElement("a");
    a.href=URL.createObjectURL(new Blob([data],{type:mime||"text/plain"})); a.download=filename; a.click();
    setTimeout(()=>URL.revokeObjectURL(a.href),2000);
  }
}
function exportCsv(){
  const qids=[...new Set(Object.values(PROBES).flat().map(q=>q.id).concat(CLOSERS.map(q=>q.id)))];
  const cols=["callDate","callerName","callerRole","leadRef","parentName","kidGrade","ethnicity","market","lostDays","reached",
    "sfReason","actualReason","reasonMismatch","notes","noteWords","toneLabel","toneScore","revisit","callback","callbackTime","internalNote",...qids];
  const qq=s=>'"'+String(s==null?"":s).replace(/"/g,'""')+'"';
  const lines=[cols.join(",")];
  state.rows.forEach(r=>{
    const base=[callDateOf(r),callerOf(r),r.callerRole,r.leadRef,r.parentName,r.kidGrade||"",r.ethnicity||"",r.market,r.lostDays,r.reached,
      reasonLabel(r.sfReason), r.actualReason?reasonLabel(r.actualReason):"",
      (r.sfReason&&r.actualReason&&r.sfReason!==r.actualReason)?"yes":"no",
      r.notes, wordCount(r.notes), r.tone?r.tone.label:"", r.tone?r.tone.score:"", r.revisit, r.callback, r.callbackTime, r.note];
    lines.push(base.concat(qids.map(id=>{const v=ansOf(r,id); return Array.isArray(v)?v.join(" | "):(v==null?"":v);})).map(qq).join(","));
  });
  saveFile("lost-lead-debriefs-"+today()+".csv","\ufeff"+lines.join("\n"),"text/csv");
}

$("#nav").onclick=e=>{const b=e.target.closest("button[data-view]"); if(!b)return; state.view=b.dataset.view; render();};

render();
boot();
</script>
